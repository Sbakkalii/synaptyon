# SynaptYon SARL: product site, served as a GitHub Pages project site at
# https://sbakkalii.github.io/synaptyon/ until a company domain exists.
title: "SynaptYon"
legal_name: "SynaptYon SARL"
tagline: "Document Intelligence, end to end"
description: >-
  SynaptYon builds Document Intelligence end to end: capture, OCR and
  handwriting, layout, classification, key information extraction, entities,
  question answering, search, summarisation and translation for business,
  financial, historical and healthcare documents, with a memory that keeps
  what it reads.
url: "https://sbakkalii.github.io"
baseurl: "/synaptyon"
lang: en

# The site is a preview: no company domain, no legal notice yet, so it stays
# out of search engines (robots.txt and a meta tag on every page).
noindex: true

# Company mailbox until a company domain exists.
contact_email: "sbakkali.sirajai@gmail.com"
founder_site: "https://sbakkalii.github.io/"

markdown: kramdown
permalink: pretty
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

defaults:
  - scope: { path: "" }
    values: { layout: default }
