# SynaptYon SARL: product site, served as a GitHub Pages project site at
# https://sbakkalii.github.io/synaptyon/ until a company domain exists.
title: "SynaptYon"
legal_name: "SynaptYon SARL"
tagline: "Persistent memory for Document AI"
description: >-
  SynaptYon builds persistent, evidence-grounded memory for Document AI: six
  products from the architecture in "Amnesia by Design, Memory By Necessity"
  (arXiv:2609.32041). Systems that keep what they read, know where it came
  from, know when it stops being true, and forget on request.
url: "https://sbakkalii.github.io"
baseurl: "/synaptyon"
lang: en

# The site is a preview: no company domain, no legal notice yet, so it stays
# out of search engines (robots.txt and a meta tag on every page).
noindex: true

# Contact goes to the founder until a company mailbox exists.
contact_email: "souhail.bakkali@irisa.fr"
founder_site: "https://sbakkalii.github.io/"

markdown: kramdown
permalink: pretty
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

defaults:
  - scope: { path: "" }
    values: { layout: default }
