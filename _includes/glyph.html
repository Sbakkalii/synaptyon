{%- comment -%}
  Small line illustrations for the four domain cards (200 × 110 grid).
  Elements with class "g-key" carry the cyan accent and animate.
  Usage: {% include glyph.html id="legal" %}
{%- endcomment -%}
<svg class="glyph glyph--{{ include.id }}" viewBox="0 0 200 110" aria-hidden="true" focusable="false">
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  {%- case include.id -%}
  {%- when "legal" %}
    <rect x="18" y="14" width="62" height="82" rx="4" class="g-mute"/>
    <path d="M28 30h42M28 40h34M28 50h40" class="g-mute"/>
    <path d="M28 64h38" class="g-strike"/>
    <rect x="112" y="22" width="62" height="74" rx="4"/>
    <path d="M122 38h42M122 48h30"/>
    <path d="M122 64h38" class="g-key"/>
    <path d="M84 64 C94 64 100 64 108 64" class="g-key g-flow" stroke-dasharray="3 4"/>
    <circle cx="164" cy="22" r="9" class="g-mute"/><path d="M164 17v5l3 2" class="g-mute"/>
  {%- when "health" %}
    <path d="M10 70 H44 L52 52 L60 86 L68 40 L76 70 H120 L128 58 L136 70 H190" class="g-mute"/>
    <g class="g-dots" stroke="none" fill="currentColor">
      <circle cx="30" cy="70" r="3.2"/><circle cx="96" cy="70" r="3.2"/><circle cx="156" cy="70" r="3.2"/>
    </g>
    <circle cx="186" cy="70" r="5" class="g-key g-ping"/>
    <path d="M156 70 C168 52 176 52 186 66" class="g-key" stroke-dasharray="3 4"/>
    <path d="M176 30 l6 10 h-12 z" class="g-key"/><path d="M176 34v3" class="g-key"/>
  {%- when "audit" %}
    <rect x="14" y="20" width="54" height="70" rx="4"/>
    <path d="M24 36h34M24 48h26M24 60h34" class="g-mute"/>
    <path d="M24 74h20" class="g-key"/>
    <path d="M68 55 H96" class="g-key g-flow" stroke-dasharray="3 4"/>
    <circle cx="104" cy="55" r="7" class="g-key"/>
    <path d="M110 51 L136 30 M110 59 L136 80 M111 55 H136" class="g-mute"/>
    <rect x="138" y="20" width="40" height="20" rx="3" class="g-mute"/>
    <rect x="138" y="45" width="40" height="20" rx="3"/>
    <rect x="138" y="70" width="40" height="20" rx="3" class="g-mute"/>
  {%- when "science" %}
    <rect x="20" y="30" width="44" height="58" rx="3" class="g-mute"/>
    <rect x="30" y="22" width="44" height="58" rx="3" class="g-mute"/>
    <rect x="40" y="14" width="44" height="58" rx="3"/>
    <path d="M50 30h24M50 40h18" class="g-mute"/>
    <path d="M90 44 C110 44 118 44 132 44" class="g-key g-flow" stroke-dasharray="3 4"/>
    <path d="M128 40 l5 4 -5 4" class="g-key"/>
    <rect x="140" y="22" width="44" height="58" rx="3" class="g-key"/>
    <path d="M150 38h24M150 48h18M150 58h22" />
    <path d="M44 96h40" class="g-strike"/>
  {%- endcase %}
  </g>
</svg>
