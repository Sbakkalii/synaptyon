hero:
  kicker: "SynaptYon // Document Intelligence"
  title: "Document AI that remembers."
  lead: >-
    From the first scan to the last answer. SynaptYon reads, extracts and
    answers questions on business, financial and historical documents, and
    remembers what it learned, with a source for every fact.
  reassure: "Four products · one chain · backed by published research"

# Fig. 3 of the paper: six lifecycle operations over the state, with the
# provenance ledger as an invariant underneath all of them.
lifecycle:
  kicker: "How Mnemos works // six steps"
  title: "Six operations. One state."
  sub: "Every document goes through the same lifecycle. Each step is a product, and provenance runs under all of them."
  steps:
    - id: acquire
      num: "01"
      name: "Acquire"
      verbs: "Read · Structure"
      promise: "Read the whole document, once."
      product: mnemos
      ref: "Eq. (3) · D_t = (V, T, B, G, H, M)"
      intro: "The observation is conditioned on the document, not on a query: state has to hold the full content for questions nobody has asked yet."
      items:
        - { title: "Text, layout and image together", body: "Cross-modal vision-language reading of the page, in the line of GlobalDoc and VLCDoC." }
        - { title: "Structure is meaning", body: "Table rows and columns, figure–caption links, form–field pairs and section trees are kept as graphs, not flattened to text." }
        - { title: "Identity and version", body: "Metadata carries document identity, version, timestamp and policy: an amendment means nothing without the version it amends." }
      outcome: "A complete, structured observation of every document."
    - id: validate
      num: "02"
      name: "Validate"
      verbs: "Corroborate · Gate"
      promise: "Nothing is written unverified."
      product: argus
      ref: "Eq. (7) · Theorem III.4"
      intro: "A wrong value written to memory is not one wrong answer. It is a durable error that every later session inherits."
      items:
        - { title: "Corroborate", body: "Check the observation against what the provenance ledger already supports or contradicts." }
        - { title: "Score confidence", body: "Epistemic confidence from predictive entropy over the extracted fields; below threshold, the state is left unchanged." }
        - { title: "Measure the gate", body: "Estimate its false-accept rate with controlled corruption, then plan with the contamination bound." }
      outcome: "Admitted evidence, or an unchanged state."
    - id: write
      num: "03"
      name: "Write"
      verbs: "Append · Tag"
      promise: "Append, never overwrite."
      product: mnemos
      ref: "Episodic store E_t"
      intro: "Admitted evidence is appended to the episodic store, tagged with when it arrived and where it came from."
      items:
        - { title: "Timestamped", body: "Each entry records its ingestion time, separately from the document's own dates." }
        - { title: "Source-tagged", body: "Each entry links to document, region and version in the provenance ledger." }
        - { title: "Fast and faithful", body: "The episodic store is built for quick, high-fidelity writes; abstraction happens later, and slower." }
      outcome: "An episodic record of everything admitted."
    - id: consolidate
      num: "04"
      name: "Consolidate"
      verbs: "Abstract · Relate"
      promise: "Learn what recurs."
      product: mnemos
      ref: "Eq. (9) · max J(α) − λR(α)"
      intro: "Repeated document families become schemas and relations, chosen by how useful they will be against what they cost to keep."
      items:
        - { title: "Schemas from families", body: "Ten thousand invoices from one supplier become one template, linked to the evidence it came from." }
        - { title: "Relations, not just vectors", body: "An associative graph links entities, documents and schemas by structure, time and analogy." }
        - { title: "Keep the tail", body: "The optimum is not the smallest representation: episodic detail stays for the rare question the schema cannot answer." }
      outcome: "Reusable schemas, still linked to their evidence."
    - id: reconcile
      num: "05"
      name: "Reconcile"
      verbs: "Supersede · Coexist"
      promise: "Know what holds, and since when."
      product: chronos
      ref: "𝒮_sup · five outcomes"
      intro: "New evidence is reconciled against the store into one of five outcomes, never by blind overwriting."
      items:
        - { title: "Four clocks", body: "Publication, event, effective and ingestion time are tracked separately." }
        - { title: "Five outcomes", body: "Support, supersede, scope-coexist, retain conflict, or escalate for review, and the outcome is recorded." }
        - { title: "History kept", body: "A superseded claim's validity interval is closed, not erased, so audits can see what changed and when." }
      outcome: "Claims with validity intervals, and their history."
    - id: forget
      num: "06"
      name: "Forget"
      verbs: "Erase · Repair · Certify"
      promise: "Erase across every store."
      product: lethe
      ref: "Algorithm 2 · five levels"
      intro: "A deletion request reaches every representation derived from the target, including schemas that absorbed it."
      items:
        - { title: "Beyond the file", body: "Raw files, page images, OCR caches, embeddings, graph nodes and index entries." }
        - { title: "Schema repair", body: "Re-consolidate what depended on the deleted evidence; this is where current systems stop." }
        - { title: "Certificate", body: "Probe-based bounds on residual leakage, reported with Forgetting Fidelity and Coverage Retention." }
      outcome: "A repaired state and an audit certificate."
  rail:
    symbol: "P_t"
    name: "Source tracing"
    body: "Runs under every step: any answer traces back to the place on the page it came from."
    product: ariadne

# Production commitments: what every product in the chain is designed to do.
commitments:
  kicker: "Built for production // six commitments"
  title: "Documents you can act on."
  items:
    - { title: "Every value cites its box", body: "Fields, answers and summaries point to the document, region and version they came from.", product: ariadne }
    - { title: "Nothing written unverified", body: "Low-confidence extractions go to review instead of into memory, and the gate's error rate is measured.", product: argus }
    - { title: "Versions, not overwrites", body: "Amendments close the old value at their effective date and keep it for audit.", product: chronos }
    - { title: "Deletion you can prove", body: "Erasure reaches every derived record, schemas included, with a certificate.", product: lethe }
    - { title: "Permissions down to the clause", body: "Tenants, matters and teams stay apart, and a clause can be visible while its price is not.", product: mnemos }
    - { title: "Measured on your documents", body: "Every pilot reports accuracy on your labels and the five harness metrics together.", product: anamnesis }

