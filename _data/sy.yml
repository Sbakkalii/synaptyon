loop:
  kicker: "The loop // Algorithm 1"
  title: "Not a pipeline. A state that learns."
  sub: "A pipeline answers once. The per-session transition reads, checks, writes, abstracts and reconciles, then answers from what it now knows."
  steps:
    - { name: "Observe", body: "Read the document as pixels, tokens, boxes, graphs, trees and metadata." }
    - { name: "Corroborate", body: "Look up what prior evidence supports or contradicts." }
    - { name: "Validate", body: "Admit the evidence, or leave the state unchanged." }
    - { name: "Write", body: "Append to the episodic store, extend provenance." }
    - { name: "Consolidate", body: "Abstract what recurs into schemas and relations." }
    - { name: "Reconcile", body: "Apply supersession; close what no longer holds." }
    - { name: "Answer", body: "Answer from the new state, and cite it." }
  support: "The paper's decisive experiment: the same base model, the same future documents, different valid prior histories, and therefore different future competence."

engagements:
  kicker: "Work with us // three ways in"
  title: "Start with your documents."
  items:
    - id: audit
      num: "01"
      kicker: "Statefulness audit"
      title: "Is your Document AI stateless?"
      body: "We code your pipeline and your evaluation against the eight statefulness criteria of the paper's audit, and place it among the degenerate regimes: zero-state, append-only, or unstructured summarization."
      steps:
        - "A review of the pipeline: what persists between sessions, and in what form."
        - "Your benchmarks coded against the eight criteria of Table IV."
        - "The gaps that matter for your documents, ranked."
      outcome: "A criterion-by-criterion audit, with the gaps that matter first."
      product: anamnesis
    - id: pilot
      num: "02"
      kicker: "Longitudinal pilot"
      title: "Does memory pay on your stream?"
      body: "We build a stream from your own documents, with session boundaries, amendments, recurring families, deletion requests and unanswerable questions, and run the three arms on it."
      steps:
        - "A stream with the eight mandatory properties, built from your documents."
        - "Warm, retrieval-only and cold arms under identical weights."
        - "Experience Gain, Cost Efficiency, Memory Harm, Forgetting Fidelity and Coverage Retention, together."
      outcome: "The five metrics on your data, and what they mean for your decision."
      product: anamnesis
    - id: build
      num: "03"
      kicker: "Build"
      title: "Persistent state, in your stack."
      body: "We put Mnemos in place with the gate, reconciliation, provenance and forgetting your domain needs, on substrates you control, with multi-tenant isolation from the start."
      steps:
        - "State design: which of the six components, on which substrates."
        - "Gate, reconciliation and forgetting policies for your documents."
        - "Hand-over: documentation, runbooks, and the harness to keep measuring."
      outcome: "A state layer you own and can audit."
      product: mnemos

name:
  kicker: "The name // σύναψις"
  title: "A joining together."
  word: "SynaptYon"
  root: "σύναψις"
  translit: "synapsis"
  gloss: "Greek: a joining together, a conjunction. Also the root of “synapse”, where one neuron hands a signal to the next."
  body: "The paper's target is a conjunction too: <span class=\"math\">C*</span> asks for multimodal evidence, document structure, persistence, temporal validity, provenance and governance at once, and no existing paradigm has all six."
  products:
    - { id: mnemos, root: "μνήμη", gloss: "memory" }
    - { id: argus, root: "Ἄργος", gloss: "the hundred-eyed watchman" }
    - { id: chronos, root: "χρόνος", gloss: "time" }
    - { id: ariadne, root: "Ἀριάδνη", gloss: "her thread led out of the labyrinth" }
    - { id: lethe, root: "Λήθη", gloss: "the river of forgetting" }
    - { id: anamnesis, root: "ἀνάμνησις", gloss: "recollection" }

