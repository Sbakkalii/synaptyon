engagements:
  kicker: "Work with us // three steps"
  title: "From your documents to production."
  items:
    - id: discovery
      num: "01"
      kicker: "Discovery"
      title: "Where does Document AI pay in your flows?"
      body: "We map what arrives, in which volumes and formats, who reads it and which decisions follow, and we check how well any existing pipeline carries knowledge from one document to the next."
      steps:
        - "Document flows mapped: sources, volumes, formats, owners."
        - "The decisions each document feeds, and what an error costs."
        - "The products that matter for you, and the metrics to judge them."
      outcome: "A scoped plan: which products, on which documents, judged how."
      product: anamnesis
    - id: pilot
      num: "02"
      kicker: "Pilot"
      title: "Proof on your own documents."
      body: "We run the chain products you need on a stream of your documents, with the accuracy targets you set per field and the harness metrics: warm state against retrieval-only and cold processing."
      steps:
        - "A stream built from your documents, with session boundaries and the edge cases you care about."
        - "Field-level accuracy on your labels, plus Experience Gain, Cost Efficiency, Memory Harm, Forgetting Fidelity and Coverage Retention."
        - "A review of every error class with your team."
      outcome: "Numbers on your data, and a go or no-go."
      product: anamnesis
    - id: production
      num: "03"
      kicker: "Production"
      title: "Rolled out, and owned by you."
      body: "We integrate the pipeline with your systems on the infrastructure agreed in the pilot, with validation gates, version history, citations and deletion policies set for your domain."
      steps:
        - "Integration with your intake, storage and business applications."
        - "Gate, reconciliation, retention and access policies for your documents."
        - "Documentation, runbooks and the harness to keep measuring."
      outcome: "A document pipeline you own and can audit."
      product: mnemos

name:
  kicker: "The names // σύναψις"
  title: "A joining together."
  word: "SynaptYon"
  root: "σύναψις"
  translit: "synapsis"
  gloss: "Greek: a joining together, a conjunction. Also the root of “synapse”, where one neuron hands a signal to the next."
  body: "That is what the products do: they join reading, extraction, answers and memory into one chain, so each step builds on the others."
  products:
    - { id: grammata, name: "Grammata", root: "γράμματα", gloss: "letters" }
    - { id: kleis, name: "Kleis", root: "κλείς", gloss: "key" }
    - { id: sibyl, name: "Sibyl", root: "Σίβυλλα", gloss: "the oracle who answered" }
    - { id: mnemos, name: "Mnemos", root: "μνήμη", gloss: "memory" }

