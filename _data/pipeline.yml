# Pipeline explorer (_includes/components/pipeline.html): one fictional
# document through the whole chain, with the output each product would give.
#
# Everything here is scripted and illustrative. Every person, company,
# address and place is invented; postcodes start with 00 and every
# identifier (IBAN, SIRET, VAT, RPPS, account numbers) is zeros or X's.
#
# Page model. A document is drawn from its `lines` on a page of `page.w` x
# `page.h` units. A line has an id, a box `b` [x, y, w, h], its text `t`,
# a style `st`, an anchor `a` (end, mid) and a recognition confidence `c`
# (default 0.985) with per-word exceptions in `lo` (all below 0.90, so they
# are the flagged words). `art` is drawn decoration (logos, rules, stamps,
# signatures). `regions` are the layout output in reading order; a region's
# box is its `box`, or its lines' bounding box.
#
# Refs. Wherever an output points at the page (`at`, `near`) it uses a
# region id (r3), a line id (l12), a span inside a line ("l12#text", the
# first occurrence) or a literal box [x, y, w, h]; a list combines several.
#
# Stage ids match `demo_stage` in _data/products.yml; `product` names the
# product whose name and role the include looks up there.

note: "Illustrative: scripted outputs on fictional documents. Confidences and scores are examples, not measurements."

stages:
  - { id: ingest,    name: "Ingest",    product: agora }
  - { id: read,      name: "Read",      product: grammata }
  - { id: layout,    name: "Layout",    product: morphe }
  - { id: classify,  name: "Classify",  product: taxis }
  - { id: extract,   name: "Extract",   product: kleis }
  - { id: entities,  name: "Entities",  product: onoma }
  - { id: verify,    name: "Verify",    product: pistis }
  - { id: ask,       name: "Ask",       product: sibyl }
  - { id: summarise, name: "Summarise", product: epitome }
  - { id: translate, name: "Translate", product: hermeneus }
  - { id: remember,  name: "Remember",  product: mnemos }

region_types:
  logo: "Logo"
  title: "Title"
  header: "Header"
  address: "Address"
  paragraph: "Paragraph"
  table: "Table"
  total: "Total"
  item: "List item"
  date: "Date"
  patient: "Patient"
  signature: "Signature"
  stamp: "Stamp"
  margin: "Margin note"
  footer: "Footer"

