        brief: "5 checks: 4 pass, 1 warning"
        checks:
          - { id: sum, name: "Line items sum to the subtotal", result: pass, detail: "444,00 + 201,60 + 352,80 + 65,00 = 1 063,40", at: [l30, l34, l38, l42, l44] }
          - { id: vat, name: "VAT is consistent", result: pass, detail: "20 % × 1 063,40 = 212,68, and 1 063,40 + 212,68 = 1 276,08", at: [l45, l46, l48] }
          - { id: rows, name: "Row arithmetic", result: pass, detail: "Quantity × unit price = amount on all 4 rows; the low-confidence “48” is confirmed by 48 × 4,20 = 201,60", at: r7 }
          - { id: due, name: "Due date follows the terms", result: pass, detail: "14/03/2026 + 30 days = 13/04/2026", at: [l12, l14, "l50#Paiement à 30 jours"] }
          - { id: po, name: "Purchase order reference", result: warn, detail: "No PO number on the invoice: approval needs a manual match", at: r4 }
      ask:
        brief: "3 answers with citations, 1 explicit abstention"
        qa:
          - { q: "What is the total amount due?", a: "1 276,08 € including 20 % VAT, due by 13 April 2026.", conf: 0.97, at: [l47, l48] }
