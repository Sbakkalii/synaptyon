          - { text: "Hélène Vasseur", type: PERSON, id: "per:0913", seen: "2 delivery notes signed for this client", at: "l19#Hélène Vasseur" }
          - { text: "Brimeval-sur-Ardelle", type: PLACE, id: "plc:0170", seen: "the supplier’s registered address", at: "l5#Brimeval-sur-Ardelle" }
          - { text: "Castelnoir-les-Prés", type: PLACE, id: "plc:0340", seen: "the bank statement in this demo", at: "l21#Castelnoir-les-Prés" }
