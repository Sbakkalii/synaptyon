          - { key: subtotal_excl_vat, raw: "1 063,40 €", norm: "1063.40 EUR", conf: 0.98, at: l44 }
          - { key: vat_amount, raw: "212,68 €", norm: "212.68 EUR (rate 0.20)", conf: 0.98, at: [l45, l46] }
          - { key: total_incl_vat, raw: "1 276,08 €", norm: "1276.08 EUR", conf: 0.99, at: l48 }
