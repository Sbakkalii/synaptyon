          - { q: "Who approved this purchase?", abstain: true, a: "Not stated. The invoice names a contact at the client, not an approver, so there is no region to cite.", near: "l19#Mme Hélène Vasseur" }
      summarise:
        brief: "3 sentences, each citing its regions"
        sentences:
          - { t: "Verdane Fournitures invoices Les Ormeaux Hôtellerie for a March restock of bed and bath linen.", at: [r2, r5, r6] }
          - { t: "Four lines come to 1 063,40 € before VAT and 1 276,08 € with 20 % VAT.", at: [r7, r8] }
          - { t: "Payment is due by bank transfer by 13 April 2026, with late-payment penalties stated.", at: [r9, r10] }
      translate:
        brief: "2 regions, French → English, terminology kept"
        items:
          - at: r9
            dst: "Payment terms. Payment within 30 days by bank transfer, no later than 13/04/2026. IBAN FR76 XXXX XXXX XXXX XXXX XXXX 000 · BIC XXXXFRXX"
            terms: [["virement", "bank transfer"], ["au plus tard", "no later than"]]
          - at: r10
            dst: "In the event of late payment, penalties at three times the statutory interest rate and a fixed indemnity of €40 for recovery costs."
            terms: [["taux d’intérêt légal", "statutory interest rate"], ["indemnité forfaitaire", "fixed indemnity"]]
      remember:
        brief: "4 claims written with provenance; matches a known supplier template"
        claims:
          - { s: "Verdane Fournitures SAS", p: "bank account", o: "FR76 XXXX … 000", from: "2026-03-14", at: l51 }
          - { s: "FV-2026-0418", p: "amount due", o: "1 276,08 € incl. VAT", from: "2026-03-14", to: "2026-04-13", at: [l47, l48] }
          - { s: "Les Ormeaux Hôtellerie SARL", p: "payment terms", o: "30 days, bank transfer", from: "2026-03-14", at: l50 }
          - { s: "Hélène Vasseur", p: "contact at", o: "Les Ormeaux Hôtellerie SARL", from: "2026-03-14", status: review, note: "surname read at 0.86: held for review before it is used", at: l19 }
        reconcile:
          outcome: "Supports"
          text: "Matches the supplier template learned from 6 earlier invoices: same layout, VAT number and bank account. Nothing is superseded."
          at: [r1, r2, l51]

